name: API CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: local
      NODE_ENV: test
      DATABASE_URL: postgresql://crit_app:crit_app@127.0.0.1:5432/crit_db
      PLATFORM_DATABASE_URL: postgresql://crit_platform_app:crit_platform_app@127.0.0.1:5432/crit_db
      JWT_SECRET: ci-demo-jwt-secret-1234567890abcd
      PLATFORM_JWT_SECRET: ci-demo-platform-jwt-secret-1234567890abcd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run validate:openapi
      - run: npm audit --audit-level=high --omit=dev
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan for secrets
        run: gitleaks dir . --no-banner --redact
