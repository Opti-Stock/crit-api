services:
  main-api:
    build: .
    image: crit-api:local
    command: ["node", "dist/apps/main-api/server.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://crit_app:crit_app@host.docker.internal:5432/crit_db}
      PLATFORM_DATABASE_URL: ${API_PLATFORM_DATABASE_URL:-postgresql://crit_platform_app:crit_platform_app@host.docker.internal:5432/crit_db}
      MAIN_API_PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  admin-api:
    image: crit-api:local
    command: ["node", "dist/apps/admin-api/server.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
