      PLATFORM_DATABASE_URL: ${API_PLATFORM_DATABASE_URL:-postgresql://crit_platform_app:crit_platform_app@host.docker.internal:5432/crit_db}
      ADMIN_API_PORT: 3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  checkin-api:
    image: crit-api:local
