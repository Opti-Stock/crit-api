      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://crit_app:crit_app@host.docker.internal:5432/crit_db}
      PLATFORM_DATABASE_URL: ${API_PLATFORM_DATABASE_URL:-postgresql://crit_platform_app:crit_platform_app@host.docker.internal:5432/crit_db}
      CHECKIN_API_PORT: 3002
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  super-admin-api:
    image: crit-api:local
    command: ["node", "dist/apps/super-admin-api/server.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${API_DATABASE_URL:-postgresql://crit_app:crit_app@host.docker.internal:5432/crit_db}
      PLATFORM_DATABASE_URL: ${API_PLATFORM_DATABASE_URL:-postgresql://crit_platform_app:crit_platform_app@host.docker.internal:5432/crit_db}
